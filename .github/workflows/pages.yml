# Deploys the published site: the built app (site/, made by tools/publish.mjs) at the root and the
# documentation reader (docs/) at /docs/. Nothing is built here; the app's data comes from the
# wiki archive, which stays with the maintainer.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          test -f site/index.html
          mkdir _site
          cp -r site/. _site/
          cp -r docs _site/docs
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
